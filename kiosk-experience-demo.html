<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kiosk Experience — Demo</title>

<!-- ══════════════════════════════════════════════════════════════════
     INTERACTIVE KIOSK EXPERIENCE — DEMONSTRATION BUILD

     Single file. Runs offline. No hosting, no internet, no CMS needed.
     Copy to the tablet, open in Chrome, use Add to Home Screen.

     ⚠ ALL CONTENT IS PLACEHOLDER. Product names are factual; every
     image, description and address is invented for demonstration and
     must be replaced with client-approved assets before any public use.

     Edit the CONTENT block near the bottom to change anything.
     ══════════════════════════════════════════════════════════════════ -->

<style>
:root{
  --void:#0b0616;
  --deep:#150a2e;
  --mid:#2a1358;
  --lift:#3d1f7a;
  --glow:#8b6cf0;
  --ice:#5ec8f0;
  --paper:#f4f2f8;
  --warn:#0a0512;
  --warnbar:56px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--void);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;overscroll-behavior:none;
}

/* ─── ambient field ─── */
#field{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(110% 80% at 80% 12%, var(--lift) 0%, transparent 55%),
    radial-gradient(90% 70% at 12% 92%, #16406e 0%, transparent 52%),
    linear-gradient(160deg,var(--void) 0%,var(--deep) 48%,var(--mid) 100%);
}
#field::after{
  content:"";position:absolute;top:-30%;left:-30%;width:160%;height:160%;
  background:radial-gradient(closest-side,rgba(139,108,240,.20),transparent 70%);
  animation:drift 22s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:translate3d(-5%,-3%,0) scale(1)}
  to{transform:translate3d(7%,5%,0) scale(1.2)}
}

/* ─── screens ─── */
.screen{
  position:fixed;inset:0 0 var(--warnbar) 0;z-index:2;
  display:none;flex-direction:column;
  opacity:0;transition:opacity 380ms ease;
}
.screen.on{display:flex}
.screen.vis{opacity:1}

/* ─── persistent health warning (regulatory) ─── */
#warning{
  position:fixed;left:0;right:0;bottom:0;height:var(--warnbar);z-index:20;
  display:flex;align-items:center;justify-content:center;gap:22px;
  background:var(--warn);border-top:1px solid rgba(255,255,255,.14);
  padding:0 20px;text-align:center;
}
#warning span{
  font-size:clamp(10px,1.25vw,13px);font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;
  color:rgba(255,255,255,.82);line-height:1.3;
}
#warning span.ar{font-weight:600;letter-spacing:0;text-transform:none;font-size:clamp(11px,1.35vw,14px)}

/* ═══ ATTRACT ═══ */
#attract{align-items:center;justify-content:center;gap:24px;padding:6vw;text-align:center;cursor:pointer}
#attract h1{font-size:clamp(34px,7vw,84px);font-weight:200;letter-spacing:-.03em;line-height:1.04}
#attract h1 b{font-weight:700}
#attract p{font-size:clamp(14px,2.1vw,23px);color:rgba(255,255,255,.6);max-width:24ch;line-height:1.45}

#tap{
  margin-top:20px;display:flex;align-items:center;gap:15px;
  padding:15px 28px 15px 19px;border-radius:99px;
  background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:clamp(14px,1.8vw,19px);font-weight:600;
}
.ring{position:relative;width:30px;height:30px;flex:0 0 auto}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #fff}
.ring::before{animation:pulse 2.4s ease-out infinite}
.ring::after{animation:pulse 2.4s ease-out infinite 1.2s}
.ring i{position:absolute;inset:9px;border-radius:50%;background:#fff}
@keyframes pulse{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.4);opacity:0}}

/* ═══ AGE GATE ═══ */
#age{align-items:center;justify-content:center;gap:22px;padding:5vw;text-align:center}
#age h2{font-size:clamp(21px,3.4vw,38px);font-weight:300;letter-spacing:-.01em;max-width:20ch;line-height:1.25}
#age .legal{font-size:clamp(11px,1.35vw,14px);color:rgba(255,255,255,.5);max-width:56ch;line-height:1.6}
.picker{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.picker select{
  appearance:none;-webkit-appearance:none;
  min-width:150px;padding:16px 22px;border-radius:12px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.26);
  color:#fff;font-size:17px;font-family:inherit;font-weight:600;text-align:center;
}
.picker select option{background:#1a0d33;color:#fff}

.btn{
  padding:16px 40px;border:0;border-radius:12px;
  background:#fff;color:var(--void);
  font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.26)}
#ageErr{color:#ff9a8b;font-size:14px;font-weight:600;min-height:18px}

/* ═══ SHARED CHROME ═══ */
.top{
  flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:18px 26px;border-bottom:1px solid rgba(255,255,255,.1);
}
.brand{font-size:clamp(15px,1.8vw,20px);font-weight:700;letter-spacing:.16em}
.top .spacer{flex:1}

.iconbtn{
  display:flex;align-items:center;gap:9px;
  padding:11px 19px;border:1px solid rgba(255,255,255,.26);border-radius:10px;
  background:rgba(255,255,255,.09);color:#fff;
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
}
.iconbtn:active{background:rgba(255,255,255,.18)}
.iconbtn svg{width:15px;height:15px;fill:currentColor}

.body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px}
.body::-webkit-scrollbar{width:0}

.nav{
  flex:0 0 auto;display:flex;gap:12px;
  padding:16px 26px;border-top:1px solid rgba(255,255,255,.1);
}
.nav button{
  flex:1;padding:16px 10px;border:1px solid rgba(255,255,255,.2);border-radius:12px;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.72);
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
}
.nav button.sel{background:#fff;color:var(--void);border-color:#fff}

/* ═══ PRODUCT GRID ─── the signature: cards lit from within ═══ */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px}

.card{
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.16);border-radius:18px;
  background:rgba(255,255,255,.05);
  padding:22px 20px 20px;cursor:pointer;
  transition:transform 220ms ease,border-color 220ms ease;
}
.card:active{transform:scale(.975)}
.card::before{
  content:"";position:absolute;left:50%;top:-40%;
  width:190px;height:190px;margin-left:-95px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(139,108,240,.55),transparent 72%);
  opacity:.55;transition:opacity 300ms ease;
}
.card:active::before{opacity:1}

.card .art{position:relative;height:132px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.card .art svg{height:100%;width:auto;filter:drop-shadow(0 12px 26px rgba(0,0,0,.5))}
.card h3{position:relative;font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:5px}
.card p{position:relative;font-size:13px;color:rgba(255,255,255,.58);line-height:1.45}
.card .ph{
  position:absolute;top:12px;right:12px;z-index:2;
  font-size:9px;font-weight:700;letter-spacing:.1em;
  padding:4px 8px;border-radius:5px;
  background:rgba(255,255,255,.16);color:rgba(255,255,255,.72);
}

/* ═══ DETAIL ═══ */
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:30px;align-items:center}
@media (max-width:760px){.detail{grid-template-columns:1fr;gap:18px}}

.detail .stage{
  position:relative;display:flex;align-items:center;justify-content:center;
  min-height:230px;border-radius:20px;
  background:radial-gradient(closest-side,rgba(139,108,240,.34),transparent 74%);
}
.detail .stage svg{height:210px;width:auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
.detail h2{font-size:clamp(24px,3.6vw,40px);font-weight:300;letter-spacing:-.02em;margin-bottom:12px}
.detail h2 b{font-weight:700}
.detail .lead{font-size:clamp(14px,1.75vw,18px);color:rgba(255,255,255,.66);line-height:1.6;margin-bottom:22px}

.specs{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.spec{display:flex;gap:14px;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.1)}
.spec dt{flex:0 0 40%;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.46)}
.spec dd{flex:1;font-size:15px;font-weight:500}

/* ═══ STORES ═══ */
.store{
  display:flex;gap:16px;align-items:flex-start;
  padding:18px;margin-bottom:12px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
}
.store .pin{
  flex:0 0 auto;width:42px;height:42px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(139,108,240,.3);
}
.store .pin svg{width:19px;height:19px;fill:var(--glow)}
.store h4{font-size:16px;font-weight:700;margin-bottom:3px}
.store p{font-size:13.5px;color:rgba(255,255,255,.58);line-height:1.5}
.store .hrs{font-size:12px;color:rgba(255,255,255,.42);margin-top:5px}

/* ═══ ABOUT / QR ═══ */
.about{max-width:64ch;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;padding-top:10px}
.about h2{font-size:clamp(22px,3.2vw,34px);font-weight:300;letter-spacing:-.02em}
.about p{font-size:clamp(14px,1.7vw,17px);color:rgba(255,255,255,.62);line-height:1.65}
.qr{
  width:150px;height:150px;border-radius:14px;background:#fff;
  display:flex;align-items:center;justify-content:center;
  color:#0b0616;font-size:11px;font-weight:700;text-align:center;
  letter-spacing:.05em;padding:14px;line-height:1.4;
}

/* ═══ IDLE WARNING ═══ */
#idle{
  position:fixed;left:50%;bottom:calc(var(--warnbar) + 18px);transform:translateX(-50%);
  z-index:30;display:none;align-items:center;gap:14px;
  padding:13px 24px;border-radius:99px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-size:14px;font-weight:600;
}
#idle.on{display:flex}

.demo-tag{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:40;
  font-size:9.5px;font-weight:700;letter-spacing:.14em;
  padding:5px 13px;border-radius:99px;
  background:rgba(255,255,255,.14);color:rgba(255,255,255,.62);
  pointer-events:none;
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="field"></div>
<div class="demo-tag">DEMONSTRATION — PLACEHOLDER CONTENT</div>

<!-- ATTRACT -->
<section class="screen" id="attract">
  <h1 id="aTitle"></h1>
  <p id="aSub"></p>
  <div id="tap"><span class="ring"><i></i></span><span id="aTap"></span></div>
</section>

<!-- AGE GATE -->
<section class="screen" id="age">
  <h2 id="gTitle"></h2>
  <div class="picker">
    <select id="gMonth"></select>
    <select id="gYear"></select>
  </div>
  <div id="ageErr"></div>
  <button class="btn" id="gGo">Confirm</button>
  <p class="legal" id="gLegal"></p>
</section>

<!-- MAIN -->
<section class="screen" id="main">
  <div class="top">
    <span class="brand" id="mBrand"></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="mHome">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3z"/></svg>
      Start over
    </button>
  </div>

  <div class="body" id="mBody"></div>

  <div class="nav">
    <button data-view="products">Products</button>
    <button data-view="stores">Find a store</button>
    <button data-view="about">Learn more</button>
  </div>
</section>

<div id="idle"><span id="idleText"></span></div>

<div id="warning">
  <span id="warnEn"></span>
  <span class="ar" id="warnAr"></span>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONTENT — everything editable lives here
   ⚠ Replace all of it with client-approved copy and assets.
   ═══════════════════════════════════════════════════════════════ */

const CONTENT = {

  brand: "BRAND",

  attract: {
    title: "Discover <b>the range</b>",
    sub:   "Touch the screen to explore devices, flavours and stores near you",
    tap:   "Touch to begin"
  },

  ageGate: {
    enabled: true,          // set false to skip during internal demos
    minAge:  18,
    title:   "This experience is intended only for adults over 18 who use nicotine or tobacco products.",
    legal:   "Please confirm your date of birth. These products are not risk free and contain nicotine, which is addictive. They are not an alternative to quitting and are not designed as cessation aids.",
    error:   "Sorry — this experience is for adults over 18 only."
  },

  // Regulatory warning, always visible. Required for tobacco
  // products in Lebanon. Confirm exact wording with the client.
  warning: {
    en: "This product damages your health and is addictive",
    ar: "هذا المنتج يضر بالصحة ويسبب الإدمان"
  },

  // Product names are factual. All descriptions and specs below
  // are INVENTED placeholders — replace before any public use.
  products: [
    { id:"a", shape:"prime", name:"Device — Prime",
      tag:"Placeholder",
      short:"The most refined option in the range.",
      lead:"Replace this paragraph with the client-approved description. Two or three lines is the right length for a screen at arm's reach.",
      specs:[["Finish","Placeholder"],["Battery","Placeholder"],["Charging","Placeholder"],["Colours","Placeholder"]] },

    { id:"b", shape:"std", name:"Device — Standard",
      tag:"Placeholder",
      short:"Familiar design, enhanced experience.",
      lead:"Replace this paragraph with the client-approved description. Keep it short — kiosk readers skim, they don't study.",
      specs:[["Finish","Placeholder"],["Battery","Placeholder"],["Charging","Placeholder"],["Colours","Placeholder"]] },

    { id:"c", shape:"one", name:"Device — One",
      tag:"Placeholder",
      short:"Pocket-sized, all in one.",
      lead:"Replace this paragraph with the client-approved description. Aim for one clear benefit rather than a feature list.",
      specs:[["Finish","Placeholder"],["Battery","Placeholder"],["Charging","Placeholder"],["Colours","Placeholder"]] }
  ],

  // Invented addresses for demonstration only.
  stores: [
    { name:"Store — Beirut Central", addr:"Placeholder address, Beirut", hrs:"Placeholder opening hours" },
    { name:"Store — Tripoli",        addr:"Placeholder address, Tripoli", hrs:"Placeholder opening hours" },
    { name:"Store — Jounieh",        addr:"Placeholder address, Jounieh", hrs:"Placeholder opening hours" },
    { name:"Store — Saida",          addr:"Placeholder address, Saida",   hrs:"Placeholder opening hours" }
  ],

  about: {
    title: "Take it with you",
    body:  "Scan the code to continue browsing on your own phone, where you can read full product information and place an order.",
    qr:    "QR CODE\nGOES HERE"
  },

  // Seconds of inactivity before returning to the attract screen.
  idleTimeout: 75,
  idleWarnAt:  15
};

/* ═══════════════════════════════════════════════════════════════
   Device illustrations — abstract placeholders, drawn in code.
   Swap for client-approved product photography.
   ═══════════════════════════════════════════════════════════════ */

function deviceSVG(shape){
  const g = '<defs><linearGradient id="g'+shape+'" x1="0" y1="0" x2="1" y2="1">'
          + '<stop offset="0%" stop-color="#cfc4f5"/><stop offset="45%" stop-color="#8b6cf0"/>'
          + '<stop offset="100%" stop-color="#4a2a9e"/></linearGradient>'
          + '<linearGradient id="s'+shape+'" x1="0" y1="0" x2="1" y2="0">'
          + '<stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>'
          + '<stop offset="35%" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>';

  if (shape === 'prime')
    return '<svg viewBox="0 0 100 210">'+g+
      '<rect x="24" y="6" width="52" height="198" rx="14" fill="url(#gprime)"/>'+
      '<rect x="24" y="6" width="52" height="198" rx="14" fill="url(#sprime)"/>'+
      '<rect x="35" y="26" width="30" height="3" rx="1.5" fill="#fff" opacity=".5"/>'+
      '<circle cx="50" cy="176" r="7" fill="#fff" opacity=".34"/></svg>';

  if (shape === 'one')
    return '<svg viewBox="0 0 100 210">'+g+
      '<rect x="28" y="34" width="44" height="142" rx="20" fill="url(#gone)"/>'+
      '<rect x="28" y="34" width="44" height="142" rx="20" fill="url(#sone)"/>'+
      '<rect x="42" y="52" width="16" height="3" rx="1.5" fill="#fff" opacity=".5"/>'+
      '<circle cx="50" cy="152" r="6" fill="#fff" opacity=".34"/></svg>';

  return '<svg viewBox="0 0 100 210">'+g+
    '<rect x="26" y="14" width="48" height="182" rx="17" fill="url(#gstd)"/>'+
    '<rect x="26" y="14" width="48" height="182" rx="17" fill="url(#sstd)"/>'+
    '<rect x="37" y="34" width="26" height="3" rx="1.5" fill="#fff" opacity=".5"/>'+
    '<circle cx="50" cy="168" r="6.5" fill="#fff" opacity=".34"/></svg>';
}

const PIN = '<svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

/* ═══════════════════════════════════════════════════════════════
   Machinery
   ═══════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const screens = { attract:$('attract'), age:$('age'), main:$('main') };
let currentScreen = null, view = 'products', idleTimer = null, tickTimer = null, left = 0;

/* fill static copy */
$('aTitle').innerHTML   = CONTENT.attract.title;
$('aSub').textContent   = CONTENT.attract.sub;
$('aTap').textContent   = CONTENT.attract.tap;
$('gTitle').textContent = CONTENT.ageGate.title;
$('gLegal').textContent = CONTENT.ageGate.legal;
$('mBrand').textContent = CONTENT.brand;
$('warnEn').textContent = CONTENT.warning.en;
$('warnAr').textContent = CONTENT.warning.ar;

/* age gate pickers */
(function(){
  const months = ["January","February","March","April","May","June","July",
                  "August","September","October","November","December"];
  const m = $('gMonth'), y = $('gYear');
  m.innerHTML = '<option value="">Month</option>' +
    months.map((n,i)=>'<option value="'+(i+1)+'">'+n+'</option>').join('');
  const now = new Date().getFullYear();
  let out = '<option value="">Year</option>';
  for (let v = now - 16; v >= now - 90; v--) out += '<option value="'+v+'">'+v+'</option>';
  y.innerHTML = out;
})();

function show(name){
  Object.values(screens).forEach(s=>{ s.classList.remove('on','vis'); });
  const s = screens[name];
  s.classList.add('on');
  requestAnimationFrame(()=> s.classList.add('vis'));
  currentScreen = name;

  if (name === 'main') startIdle(); else stopIdle();
}

/* ---- attract → age gate → main ---- */

$('attract').addEventListener('pointerdown', ()=>{
  if (CONTENT.ageGate.enabled) { $('ageErr').textContent=''; show('age'); }
  else { view='products'; render(); show('main'); }
});

$('gGo').addEventListener('click', ()=>{
  const m = parseInt($('gMonth').value,10), y = parseInt($('gYear').value,10);
  if (!m || !y){ $('ageErr').textContent = 'Please select a month and year.'; return; }
  const now = new Date();
  let age = now.getFullYear() - y;
  if (now.getMonth() + 1 < m) age--;
  if (age < CONTENT.ageGate.minAge){
    $('ageErr').textContent = CONTENT.ageGate.error;
    setTimeout(reset, 2600);
    return;
  }
  view = 'products'; render(); show('main');
});

$('mHome').addEventListener('click', reset);

document.querySelectorAll('.nav button').forEach(b=>{
  b.addEventListener('click', ()=>{ view = b.dataset.view; render(); bump(); });
});

function reset(){
  $('gMonth').value = ''; $('gYear').value = ''; $('ageErr').textContent = '';
  show('attract');
}

/* ---- views ---- */

function render(){
  document.querySelectorAll('.nav button').forEach(b=>
    b.classList.toggle('sel', b.dataset.view === view));

  const body = $('mBody');

  if (view === 'products'){
    body.innerHTML = '<div class="grid">' + CONTENT.products.map(p =>
      '<div class="card" data-id="'+p.id+'">'
      + '<span class="ph">'+p.tag+'</span>'
      + '<div class="art">'+deviceSVG(p.shape)+'</div>'
      + '<h3>'+p.name+'</h3><p>'+p.short+'</p></div>').join('') + '</div>';

    body.querySelectorAll('.card').forEach(c =>
      c.addEventListener('click', ()=>{ detail(c.dataset.id); bump(); }));
  }

  else if (view === 'stores'){
    body.innerHTML = CONTENT.stores.map(s =>
      '<div class="store"><div class="pin">'+PIN+'</div><div>'
      + '<h4>'+s.name+'</h4><p>'+s.addr+'</p>'
      + '<div class="hrs">'+s.hrs+'</div></div></div>').join('');
  }

  else {
    body.innerHTML = '<div class="about"><h2>'+CONTENT.about.title+'</h2>'
      + '<div class="qr">'+CONTENT.about.qr.replace(/\n/g,'<br>')+'</div>'
      + '<p>'+CONTENT.about.body+'</p></div>';
  }
}

function detail(id){
  const p = CONTENT.products.find(x=>x.id===id);
  if (!p) return;
  $('mBody').innerHTML =
    '<button class="iconbtn" id="back" style="margin-bottom:20px">‹ All products</button>'
    + '<div class="detail"><div class="stage">'+deviceSVG(p.shape)+'</div><div>'
    + '<h2>'+p.name+'</h2><p class="lead">'+p.lead+'</p>'
    + '<dl class="specs">' + p.specs.map(s =>
        '<div class="spec"><dt>'+s[0]+'</dt><dd>'+s[1]+'</dd></div>').join('') + '</dl>'
    + '<button class="btn ghost" id="toStores">Find a store</button></div></div>';

  $('back').addEventListener('click', ()=>{ view='products'; render(); bump(); });
  $('toStores').addEventListener('click', ()=>{ view='stores'; render(); bump(); });
}

/* ---- idle ---- */

function startIdle(){ bump(); }
function stopIdle(){
  clearTimeout(idleTimer); clearInterval(tickTimer);
  $('idle').classList.remove('on');
}

function bump(){
  if (currentScreen !== 'main') return;
  clearTimeout(idleTimer); clearInterval(tickTimer);
  $('idle').classList.remove('on');

  left = CONTENT.idleTimeout;
  tickTimer = setInterval(()=>{
    left--;
    if (left <= CONTENT.idleWarnAt && left > 0){
      $('idle').classList.add('on');
      $('idleText').textContent = 'Returning to the start in ' + left + 's — touch to stay';
    }
    if (left <= 0){ stopIdle(); reset(); }
  }, 1000);

  idleTimer = setTimeout(()=>{ stopIdle(); reset(); }, CONTENT.idleTimeout * 1000);
}

['pointerdown','keydown'].forEach(e =>
  $('main').addEventListener(e, bump, true));

/* ---- screen + hygiene ---- */

let wakeLock = null;
async function keepAwake(){
  try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
keepAwake();
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState === 'visible') keepAwake();
});

document.addEventListener('contextmenu',  e=>e.preventDefault());
document.addEventListener('dragstart',    e=>e.preventDefault());
document.addEventListener('gesturestart', e=>e.preventDefault());

/* ---- go ---- */
show('attract');
</script>
